[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minecode-mcp"
# To release: bump this, commit, then tag with a matching "v" prefix.
#     version = "0.2.1"  ->  git tag v0.2.1 && git push origin main --tags
# The publish workflow refuses to build if the tag and this value disagree,
# so a forgotten bump fails loudly instead of shipping a mislabelled release.
# PyPI version numbers are permanent -- a published version can never be
# replaced, only superseded. See "Releasing" in README.md.
version = "0.2.2"
description = "MCP Server for Minecraft datapack development with wiki, Spyglass, Misode, and Mojira integrations"
readme = "README.md"
license = "GPL-3.0-only"
authors = [
    { name = "AnCarsenat" }
]
keywords = ["minecraft", "mcp", "datapack", "copilot", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment"
]
requires-python = ">=3.10"
dependencies = [
    # Upper bound is deliberate. mcp 2.0 removed the low-level decorator API
    # (@server.list_tools / @server.call_tool) that this server is built on;
    # installing 2.x raises AttributeError at import. Migrating to the 2.x
    # MCPServer API is a separate piece of work -- until then, pin.
    "mcp>=1.25.0,<2",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0"
]

[project.optional-dependencies]
# The emulator_* tools. Becomes a required dependency once datapack-emulator
# is on PyPI; until then: pip install -e ./datapack-emulator (the submodule).
emulator = [
    "datapack-emulator>=0.2.0",
]
dev = [
    "pytest>=8.0",
    "build>=1.0",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/AnCarsenat/minecode-mcp"
Repository = "https://github.com/AnCarsenat/minecode-mcp"
Issues = "https://github.com/AnCarsenat/minecode-mcp/issues"

[project.scripts]
minecode = "minecode.server:main"

[tool.hatch.build.targets.wheel]
packages = ["minecode"]
# The preprompt, config, and migration table are data files, not Python. If
# they are missing from the wheel the server still starts but silently loses
# its version knowledge -- a failure invisible in a local editable install and
# only visible to pip-installed users. Listed explicitly so a packaging change
# cannot drop them.
artifacts = [
    "minecode/preprompts/*.txt",
    "minecode/config/*.json",
    "minecode/knowledge/*.json",
]

# The guides (skills/<name>/SKILL.md) live at the repository root so Claude
# Code can load the repository as a plugin; the wheel carries them inside the
# package, where minecode/guides.py looks first.
[tool.hatch.build.targets.wheel.force-include]
"skills" = "minecode/skills"

[tool.hatch.build.targets.sdist]
include = [
    "minecode/",
    "skills/",
    "tests/",
    "README.md",
    "LICENSE",
    "example/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: test requires network access (deselect with -m 'not network')",
]







