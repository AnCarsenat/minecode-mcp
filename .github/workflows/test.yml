name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # Live tests hit volunteer-run services (Spyglass, misode, minecraft.wiki).
  # Running them on every push would be both flaky and rude, so they get their
  # own nightly job instead.
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  offline:
    name: Offline tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run offline tests
        env:
          # Never touch the developer cache path in CI.
          MINECODE_NO_CACHE: '1'
        run: python -m pytest tests/ -v -m "not network"

      - name: Verify the server imports and the tool registry is consistent
        run: |
          python -c "
          from minecode import tools
          print(f'{len(tools.TOOLS)} tools, {len(tools.HANDLERS)} handlers')
          assert {t.name for t in tools.TOOLS} == set(tools.HANDLERS)
          "

  package:
    name: Package builds
    runs-on: ubuntu-latest
    # Separate from the test job because it checks something different:
    # tests prove the CODE works, this proves the PACKAGE can be built and
    # shipped. Those fail independently. Renaming readme.md to README.md
    # broke the build while every test still passed, and it would only have
    # surfaced at release time, as a readme error during a version tag.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Verify data files are present in the wheel
        # The preprompt, config and migration table are data files, not
        # Python. If a packaging change drops them the server still starts
        # but silently loses its version knowledge -- invisible in an
        # editable install, broken for everyone who pip-installs it.
        run: |
          WHEEL=$(ls dist/*.whl)
          CONTENTS=$(python -c "import zipfile,sys; print('\n'.join(zipfile.ZipFile(sys.argv[1]).namelist()))" "$WHEEL")
          for required in \
            "minecode/preprompts/assistant_preprompt.txt" \
            "minecode/config/config.json" \
            "minecode/knowledge/migrations.json"
          do
            if ! echo "$CONTENTS" | grep -q "$required"; then
              echo "::error::$required is missing from the wheel"
              exit 1
            fi
            echo "ok: $required"
          done

      - name: Verify the built package actually runs
        # Installs the wheel into a clean venv and drives a real MCP session
        # against it. Catches breakage that only appears once installed --
        # a missing dependency, or a data file that resolves in the source
        # tree but not from site-packages.
        #
        # Uses the mcp client library rather than piping hand-written
        # JSON-RPC. Piping races: the shell closes stdin as soon as the last
        # line is written, so the server can hit EOF and exit before it
        # answers tools/list, and `tail -1` then reads the initialize reply
        # instead. That passed locally and failed in CI with KeyError: 'tools'.
        # A real client waits for each response.
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install --quiet dist/*.whl
          /tmp/verify/bin/python - <<'PY'
          import asyncio, sys
          from mcp import ClientSession, StdioServerParameters
          from mcp.client.stdio import stdio_client

          async def main():
              params = StdioServerParameters(command="/tmp/verify/bin/minecode", args=[])
              async with stdio_client(params) as (read, write):
                  async with ClientSession(read, write) as session:
                      info = await session.initialize()
                      tools = (await session.list_tools()).tools
                      prompts = (await session.list_prompts()).prompts
                      resources = (await session.list_resources()).resources
                      print(f"server: {info.serverInfo.name}")
                      print(f"tools: {len(tools)}, prompts: {len(prompts)}, "
                            f"resources: {len(resources)}")
                      assert tools, "installed package advertised no tools"

                      # Exercise a tool that reads a packaged data file, so a
                      # wheel missing migrations.json fails here rather than
                      # silently degrading for users.
                      result = await session.call_tool(
                          "check_version_syntax",
                          {"content": "/give @s diamond_sword{Enchantments:[]} 1",
                           "version": "1.21.4", "kind": "command"},
                      )
                      import json
                      payload = json.loads(result.content[0].text)
                      assert payload["success"], payload
                      assert payload["issue_count"] > 0, (
                          "migration table did not load from the installed wheel")
                      print("migration detection works from the installed package")

          asyncio.run(main())
          PY

  live:
    name: Live API tests
    # Only on a schedule or a manual run -- see the note above.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run live tests
        run: python -m pytest tests/ -v -m network
